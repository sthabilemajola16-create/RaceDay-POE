name: RaceDay CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore RaceDay.sln
      - name: Build
        run: dotnet build RaceDay.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=raceday-tests.trx"
