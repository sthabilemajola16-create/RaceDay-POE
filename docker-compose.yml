services:
  raceday-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your local .env file}"
    ports:
      - "1433:1433"
    volumes:
      - raceday-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 15
  raceday-api:
    build:
      context: ./src/RaceDay.Api
      dockerfile: Dockerfile
    ports:
      - "5188:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RaceDay: "Server=raceday-db;Database=RaceDay;User Id=sa;Password=${MSSQL_SA_PASSWORD:-RaceDay_ChangeMe_2026!};TrustServerCertificate=True"
      AzureBlob__ConnectionString: "${AZURE_BLOB_CONNECTION_STRING:-}"
      AzureBlob__Container: "raceday-event-images"
    depends_on:
      raceday-db:
        condition: service_healthy
  raceday-web:
    build:
      context: .
      dockerfile: src/RaceDay.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Api__BaseUrl: "http://raceday-api:8080"
    depends_on:
      - raceday-api
volumes:
  raceday-sql-data:
